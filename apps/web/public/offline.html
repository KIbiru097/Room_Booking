<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F2942" />
    <title>LuxStay — Offline</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; background: #f8fafc; color: #0f2942; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(420px, 100%); text-align: center; border: 1px solid #e2e8f0; border-radius: 24px; padding: 32px 24px; background: white; box-shadow: 0 16px 40px #0f294214; }
      img { width: 72px; height: 72px; margin-bottom: 16px; }
      h1 { margin: 0 0 8px; font-size: 24px; }
      p { margin: 0; color: #64748b; line-height: 1.6; }
      button { margin-top: 24px; border: 0; border-radius: 12px; padding: 12px 18px; background: #0f2942; color: white; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/luxstay-192.svg" alt="LuxStay" />
      <h1>You’re offline</h1>
      <p>Reconnect to continue booking and discover the latest verified places.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
